services:
  jekyll:
    build:
      context: . # Use the current directory for the build context
      dockerfile: Dockerfile
    image: qwm # Default image name
    ports:
      - "4000:4000"
    volumes:
      - "$PWD:/srv/jekyll"
    command: bash -c "bundle install && bundle exec jekyll serve --watch --force_polling --drafts --future --host 0.0.0.0"
    # Command to also display `--drafts --future` dated post, useful for local development
    # command: ["bundle", "exec", "jekyll", "serve",  "--force_polling" , "--host", "0.0.0.0"]