name: "Blog submission"
description: "Submit a draft blog post"
labels:
  - blog
  - needs-review
body:
  - type: input
    id: author_name
    attributes:
      label: "Your name"
      description: "Name to show as the author"
      placeholder: "Jane Doe"
    validations:
      required: true

  - type: input
    id: post_title
    attributes:
      label: "Post title"
      placeholder: "Awesome things about that..."
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: "Tags (comma-separated)"
      placeholder: "jekyll, github, dev"
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: "Short summary"
      description: "1–3 sentences summarizing the post"
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: "Post body (Markdown)"
      description: "Write your post in Markdown. You can drag & drop images into this field."
      render: markdown
    validations:
      required: true
