name: "Blog submission flow"
description: "Submit a draft blog post"
labels:
  - blog
  - external-blog
  - needs-review
body:
  - type: input
    id: author_name
    attributes:
      label: "Your name"
      description: "Enter your name or link to your social profile"
      placeholder: "Jane Doe"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: "Tags (comma-separated)"
      placeholder: "blog, bug, feature, fact"
    validations:
      required: false

  - type: textarea
    id: body
    attributes:
      label: "Short summary"
      description: "Copy paste or format your content using markdown"
    validations:
      required: true
