name: "Blog submission"
description: "Submit a draft blog post"
labels:
  - blog
  - needs-review
body:
  - type: input
    id: author_name
    attributes:
      label: "Your name"
      description: "Name to show as the author"
      placeholder: "Jane Doe"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: "Tags (comma-separated)"
      placeholder: "bug, feature, fact"
    validations:
      required: false

  - type: textarea
    id: body
    attributes:
      label: "Short summary"
      description: "1–3 sentences summarizing the post"
    validations:
      required: true
