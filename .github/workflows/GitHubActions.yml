name: Quality With Millan - Jekyll site CI on GitHub Actions

on:
  push:
    branches: [ "prod" ]
  pull_request:
    branches: [ "prod" ]
  schedule:
    - cron: '1 0 * * *' # Runs every day at 00:01 AM UTC
    
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: prod
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
      # #conatct control
      - name: Configure feature flags
        env:
          ENABLE_CONTACT_FORM: ${{ vars.ENABLE_CONTACT_FORM || 'true' }}
        run: |
          mkdir -p _data
          echo "enable_contact_form: ${ENABLE_CONTACT_FORM}" > _data/feature_flags.yml
          echo "Resolved ENABLE_CONTACT_FORM = ${ENABLE_CONTACT_FORM}"
      # #conatct control
      - name: Build site
        env:
          ENABLE_CONTACT_FORM: ${{ vars.ENABLE_CONTACT_FORM || 'true' }}
        run: bundle exec jekyll build
      - name: Replace placeholders
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}" | cut -c1-7)
          find _site -name "*.html" -exec sed -i "s|GIT_COMMIT_HASH|$SHORT_SHA|g" {} + || true
          find _site -name "*.html" -exec sed -i 's|CONTACT_G_FORM_URL|${{ secrets.FORM_ACTION_URL }}|g' {} + || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: github-pages
