name: Issue to Jekyll Post

on:
  issues:
    types: [labeled]

jobs:
  issue_to_post:
    if: >
      contains(github.event.issue.labels.*.name, 'blog') &&
      contains(github.event.issue.labels.*.name, 'ready-to-publish')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare post file
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_CONTENT: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          # Optional: set POST_TIMEZONE to a TZ database name (e.g. 'America/Los_Angeles')
          # If not set, UTC will be used.
          POST_TIMEZONE: ${{ env.POST_TIMEZONE }}
        run: |
          # Ensure subfolder exists
          mkdir -p _posts/from_github

          # Generate a simple slug from the title (lowercase, spaces -> hyphens, strip non-alnum at ends)
          TITLE_SLUG=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9 ]//g' \
            | sed 's/[ ][ ]*/-/g' \
            | sed 's/^-//;s/-$//')

          # Use user's timezone (if provided) for post filename and timestamp
          # Export TZ inline so it doesn't affect other steps
          DATE=$(TZ="${POST_TIMEZONE:-UTC}" date +"%Y-%m-%d")
          DATETIME=$(TZ="${POST_TIMEZONE:-UTC}" date +"%Y-%m-%d %H:%M:%S %z")

          FILENAME="_posts/from_github/${DATE}-${TITLE_SLUG}.md"

          # YAML front matter for blogs from GitHub issues (direct substitution, safe)
          # Escape double quotes in ISSUE_TITLE for use in a double-quoted YAML value
          ISSUE_TITLE_SAFE="${ISSUE_TITLE//\"/\\\"}"
          # Use ISSUE_CONTENT as-is to preserve newlines and formatting
          ISSUE_CONTENT_RAW="${ISSUE_CONTENT}"
          
          # Write front matter using printf to avoid heredoc delimiter issues
          printf '%s\n' '---' "layout: single" "title: \"${ISSUE_TITLE_SAFE}\"" "permalink: \"/post/external/${TITLE_SLUG}.html\"" "search: true" "date: ${DATE}" "source_issue: ${ISSUE_NUMBER}" "source_url: ${ISSUE_URL}" 'authors:' '  - "Github Issues"' 'categories:' '  - github-issues' 'tags:' '  - GitHub-Issue' '  - external' 'seo:' "  title: \"${ISSUE_TITLE_SAFE}\"" '---' "" > "$FILENAME"

          # Insert source line and append content, preserving newlines
          printf '%s\n' "Sources: [GitHub issue #${ISSUE_NUMBER}](${ISSUE_URL})" >> "$FILENAME"
          printf '%s\n' "$ISSUE_CONTENT_RAW" >> "$FILENAME"

          echo "Generated $FILENAME"

      - name: Commit and push post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _posts/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Add post from issue #${{ github.event.issue.number }}"
          git push

          # Predict published URL and print it
          # Try to read site base URL from _config.yml; fall back to GitHub Pages URL
            # Predict published URL: read site URL from _config.yml (allow leading spaces), else fall back
            BASE_URL=$(grep -E '^\s*url:' _config.yml 2>/dev/null | head -n1 | sed 's/^[[:space:]]*url:[[:space:]]*//; s/^"//; s/"$//; s:/*$::') || true
            if [ -z "$BASE_URL" ]; then
              OWNER=${GITHUB_REPOSITORY%%/*}
              REPO_NAME=${GITHUB_REPOSITORY##*/}
              # If repo is the user/org pages repo (owner.github.io), use root; else include repo path
              if [ "$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')" = "$(echo "${OWNER}.github.io" | tr '[:upper:]' '[:lower:]')" ]; then
                BASE_URL="https://${OWNER}.github.io"
              else
                BASE_URL="https://${OWNER}.github.io/${REPO_NAME}"
              fi
            fi
            # normalize to lowercase (host and path)
            BASE_URL="$(echo "$BASE_URL" | tr '[:upper:]' '[:lower:]')"
            # ensure we have a slug; fall back to filename-based slug when needed
            if [ -z "${TITLE_SLUG}" ]; then
              TITLE_SLUG=$(basename "$FILENAME" .md | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')
            fi
            PERMALINK="/post/external/${TITLE_SLUG}.html"
            echo "Predicted published URL: ${BASE_URL%/}${PERMALINK}"