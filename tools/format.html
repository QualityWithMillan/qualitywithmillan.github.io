<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Math&display=swap');

  .format-wrapper {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, 'Noto Sans Math';
    max-width: 650px;
    width: 100%;
    margin: 10px auto;
    padding: 5px;
  }

  .format-card {
    box-sizing: border-box;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    border: 1px solid #e1e8ed;
    padding: 20px;
    width: 100%;
    max-width: 100%;
  }

  .format-title {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    text-align: center;
  }

  .field-group {
    margin-bottom: 20px;
    position: relative;
  }

  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .textarea-container {
    position: relative;
  }

  .format-wrapper textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif, 'Noto Sans Math';
    font-size: 16px;
    line-height: 1.5;
    padding: 12px 45px 12px 12px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    resize: vertical;
    background: #f8fafc;
    color: #334155;
    transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    margin: 0;
  }

  .format-wrapper textarea:focus {
    outline: none;
    border-color: #3b82f6;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  .format-wrapper textarea[readonly] {
    padding-right: 12px;
    background: #f1f5f9;
    cursor: default;
  }

  .format-wrapper #clear-button {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    transition: transform 0.2s ease, background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
  }

  .format-wrapper #clear-button:hover {
    background: #e2e8f0;
    transform: rotate(90deg);
  }

  .format-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    justify-content: center;
  }

  .format-btn {
    flex: 1;
    min-width: 60px;
    height: 44px;
    font-size: 16px;
    font-weight: 600;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    color: #000000;
  }

  .format-btn:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
    transform: translateY(-1px);
  }

  .format-btn:active {
    transform: translateY(1px);
  }

  .action-footer {
    text-align: center;
    margin-top: 10px;
  }

  .primary-btn {
    width: 100%;
    height: 46px;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    background: #3b82f6;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1);
    margin: 0;
  }

  .primary-btn:hover {
    background: #2563eb;
    transform: translateY(-1px);
  }

  .primary-btn:active {
    transform: translateY(1px);
  }

  /* Dark mode support */
  [data-theme="dark"] .format-card,
  body.dark-mode .format-card {
    background: #1e242b;
    border-color: #2d3748;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  [data-theme="dark"] .format-wrapper textarea,
  body.dark-mode .format-wrapper textarea {
    background: #151a21;
    border-color: #2d3748;
    color: #f1f5f9;
  }

  [data-theme="dark"] .format-wrapper textarea[readonly],
  body.dark-mode .format-wrapper textarea[readonly] {
    background: #1a202c;
  }

  [data-theme="dark"] .format-btn,
  body.dark-mode .format-btn {
    background: #1e242b;
    border-color: #2d3748;
    color: #f1f5f9;
  }

  [data-theme="dark"] .format-btn:hover,
  body.dark-mode .format-btn:hover {
    background: #2d3748;
    border-color: #4a5568;
  }

  @media (max-width: 480px) {
    .format-card {
      padding: 16px;
    }

    .format-btn {
      min-width: calc(33.33% - 8px);
    }
  }
</style>

<div class="format-wrapper">
  <div class="format-card" role="region" aria-label="Text Formatter Tool">
    <div class="field-group">
      <div class="textarea-container">
        <textarea id="input-text" rows="5" placeholder="Type or paste your text here..." aria-label="Input Text Area"></textarea>
        <button role="button" id="clear-button" title="Clear text" aria-label="Clear input and output text">🔄</button>
      </div>
    </div>

    <div class="format-actions" role="group" aria-label="Formatting options">
      <button role="button" id="bold-button" class="format-btn" aria-label="Format text as bold sans-serif">𝗕</button>
      <button role="button" id="italic-button" class="format-btn" aria-label="Format text as italic">𝐼</button>
      <button role="button" id="bold-italic-button" class="format-btn" aria-label="Format text as bold italic">𝗕𝐼</button>
      <button role="button" id="underline-button" class="format-btn" aria-label="Format text with underline">U̲</button>
      <button role="button" id="strikethrough-button" class="format-btn" aria-label="Format text with strikethrough">S̶</button>
      <button role="button" id="monospace-button" class="format-btn" aria-label="Format text as monospace">𝚖ono</button>
    </div>

    <div class="field-group">
      <textarea id="output-text" rows="5" placeholder="Formatted output will appear here..." aria-label="Formatted Output Area" readonly></textarea>
    </div>

    <div class="action-footer">
      <button role="button" id="copy-button" class="primary-btn" aria-label="Copy formatted text to clipboard">Copy text 📑</button>
    </div>
  </div>
</div>
