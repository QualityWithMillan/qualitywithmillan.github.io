<section class="page__share">
  {% if site.data.ui-text[site.locale].share_on_label %}
    <h4 class="page__share-title">{{ site.data.ui-text[site.locale].share_on_label | default: "Share on" }}</h4>
  {% endif %}

  {% assign share_url = "https://qualitywithmillan.github.io" | append: page.url %}

  <a href="https://x.com/intent/post?{% if site.twitter.username %}via={{ site.twitter.username | url_encode }}&{% endif %}text={{ page.title | url_encode }}%20{{ share_url | url_encode }}" class="btn btn--twitter" target="_blank" rel="noopener noreferrer" title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} Twitter / X"><i class="fa-brands fa-x-twitter fa-fw" aria-hidden="true"></i><span> Twitter / X</span></a>

  <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url | url_encode }}" class="btn btn--facebook" target="_blank" rel="noopener noreferrer" title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} Facebook"><i class="fab fa-fw fa-facebook" aria-hidden="true"></i><span> Facebook</span></a>

  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url | url_encode }}" class="btn btn--linkedin" target="_blank" rel="noopener noreferrer" title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} LinkedIn"><i class="fab fa-fw fa-linkedin" aria-hidden="true"></i><span> LinkedIn</span></a>
</section>
